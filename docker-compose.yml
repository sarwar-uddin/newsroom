services:
  postgres:
    image: postgres:18.6
    container_name: newsroom-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Disposable database for integration and e2e tests (tests TRUNCATE/DROP everything in it).
  # Start with: docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:18.6
    container_name: newsroom-postgres-test
    profiles: ['test']
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: newsroom_test
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newsroom -d newsroom_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
